[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reno-signalstack-nlp"
version = "0.1.0"
description = "Mock NLP and transcription service for Reno SignalStack"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.7"
]

[tool.setuptools]
packages = ["app"]
